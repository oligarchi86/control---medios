<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=4">
<title>Control de Medios</title>
</head>
<body>
<header>
  <div><h1>Control de Medios</h1><small>Inventario y movimientos</small></div>
</header>
<main>
<section id="loginView" class="card">
  <h2>Acceso</h2>
  <input id="loginUser" placeholder="Usuario">
  <input id="loginPass" type="password" placeholder="Contraseña">
  <button id="loginBtn">Entrar</button>
  <p class="hint">Usuario inicial: <b>admin</b> / <b>admin123</b></p>
</section>

<section id="appView" class="hidden">
  <div class="stats">
    <div><b id="countTotal">0</b><span>Equipos</span></div>
    <div><b id="countAvailable">0</b><span>Disponibles</span></div>
    <div><b id="countLoaned">0</b><span>Prestados</span></div>
  </div>
  <div class="toolbar">
    <input id="search" placeholder="Buscar equipo...">
    <button id="newBtn">+ Equipo</button>
  </div>
  <div id="list"></div>
  <div class="card">
    <button id="exportBtn" class="secondary">Exportar CSV</button>
    <button id="backupBtn" class="secondary">Copia de seguridad</button><button id="passwordBtn" class="secondary">Cambiar contraseña</button>
    <button id="logoutBtn" class="danger">Cerrar sesión</button>
  </div>
</section>
<dialog id="moveDialog"><form id="moveForm"><h2>Mover equipo</h2><input type="hidden" id="moveId"><p id="moveInfo" class="hint"></p><label>Nueva ubicación<input id="newLocation" required></label><label>Responsable<input id="movePerson"></label><label>Observación<textarea id="moveNote" rows="3"></textarea></label><div class="dialogActions"><button type="button" id="cancelMove" class="secondary">Cancelar</button><button type="submit">Mover</button></div></form></dialog><dialog id="qrDialog"><div class="qrBox"><h2 id="qrTitle">Código QR</h2><p id="qrText" class="hint"></p><canvas id="qrCanvas"></canvas><div class="dialogActions"><button id="downloadQR" class="secondary">Guardar QR</button><button id="closeQR">Cerrar</button></div></div></dialog><dialog id="passwordDialog"><form id="passwordForm">
<h2>Cambiar contraseña</h2>
<label>Contraseña actual<input id="currentPassword" type="password" required autocomplete="current-password"></label>
<label>Nueva contraseña<input id="newPassword" type="password" required minlength="6" autocomplete="new-password"></label>
<label>Repetir nueva contraseña<input id="repeatPassword" type="password" required minlength="6" autocomplete="new-password"></label>
<p class="hint">La nueva contraseña debe tener al menos 6 caracteres.</p>
<div class="dialogActions"><button type="button" id="cancelPassword" class="secondary">Cancelar</button><button type="submit">Guardar</button></div>
</form></dialog></main>

<dialog id="equipmentDialog">
<form id="equipmentForm">
<h2 id="dialogTitle">Nuevo equipo</h2>
<input type="hidden" id="equipmentId">
<label>Nombre<input id="name" required></label>
<label>Categoría<input id="category"></label>
<label>Modelo<input id="model"></label>
<label>Marca<input id="brand"></label>
<label>Número de serie<input id="serial"></label>
<label>Inventario / código<input id="inventory"></label>
<label>Ubicación<input id="location" value="Almacén"></label>
<label>Estado<select id="status"><option>Disponible</option><option>Prestado</option><option>En mantenimiento</option><option>Baja</option></select></label>
<label>Foto<input id="photo" type="file" accept="image/*" capture="environment"></label>
<div id="photoPreview"></div>
<div class="dialogActions"><button type="button" id="cancelEquipment" class="secondary">Cancelar</button><button type="submit">Guardar</button></div>
</form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="app.js?v=4"></script>
</body>
</html>
